        - "릴리 (LILY)"
        - "설윤 (SULLYOON)"
        - "배이 (BAE)"
        - "지우 (JIWOO)"
        - "규진 (KYUJIN)"
      default: 0
  - type: checkboxes
    id: options
    attributes:
      label: "옵션 / Options"
      options:
        - label: "세로 영상 (쇼츠) / Vertical video (Shorts)"
