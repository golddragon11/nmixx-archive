      description: "한 줄에 영상 하나: `링크 | 제목 | 날짜 | 썸네일`. 유튜브는 링크만 (제목·날짜 자동). 틱톡은 `링크 | 제목` (날짜 자동). 티빙은 `링크 | 제목 | 날짜` (썸네일 자동). 웨이브·넷플릭스는 `링크 | 제목 | 날짜 | 썸네일` (썸네일은 이미지 주소나 유튜브 링크).  \nOne video per line: `link | title | date | thumbnail`. YouTube: link only (title and date automatic). TikTok: `link | title` (date automatic). TVING: `link | title | date` (thumbnail automatic). Wavve, Netflix: `link | title | date | thumbnail` (an image URL or a YouTube link)."
