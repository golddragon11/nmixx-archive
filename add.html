<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>영상 추가 · Add videos</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff; --fg: #15171c; --muted: #646b78; --line: #dde1e8; --soft: #f4f6fa;
    --accent: #2b6cff; --accent-fg: #fff; --ok: #1a7f45; --warn: #9a6200; --err: #c62f2f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --fg: #e9ecf1; --muted: #98a0ad; --line: #2a2f3a; --soft: #181c24;
            --accent: #6b9bff; --accent-fg: #0f1115; --ok: #5cc98a; --warn: #e2b04a; --err: #ff7a7a; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 200px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { margin: 0 0 8px; color: var(--muted); }
  .note { margin: 0 0 16px; padding: 8px 12px; border-left: 3px solid var(--warn); background: var(--soft);
          border-radius: 0 6px 6px 0; font-size: 13px; }
  #lang { width: auto; padding: 6px 10px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .tabs button { font: inherit; padding: 10px 14px; border: 0; background: none; color: var(--muted);
                 border-bottom: 2px solid transparent; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
  fieldset { border: 0; margin: 0 0 18px; padding: 0; min-width: 0; }
  label, legend { display: block; font-weight: 600; margin: 0 0 6px; }
  .hint { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
  input[type=text], input[type=search], textarea, select {
    width: 100%; padding: 10px 12px; font: inherit; color: inherit; background: transparent;
    border: 1px solid var(--line); border-radius: 10px; }
  textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  textarea.plain { min-height: 70px; font-family: inherit; font-size: inherit; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }
  select { background: var(--bg); }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 16px; }
  .results { list-style: none; margin: 6px 0 0; padding: 0; max-height: 320px; overflow: auto;
             border: 1px solid var(--line); border-radius: 10px; }
  .results:empty { display: none; }
  .results button { display: block; width: 100%; text-align: left; font: inherit; color: inherit;
                    background: none; border: 0; border-bottom: 1px solid var(--line); padding: 9px 12px; cursor: pointer; }
  .results li:last-child button { border-bottom: 0; }
  .results button:hover, .results button:focus { background: var(--soft); outline: none; }
  .id { display: block; font-size: 12px; color: var(--muted); }
  .picked { display: flex; justify-content: space-between; gap: 12px; align-items: center;
            padding: 10px 12px; background: var(--soft); border-radius: 10px; }
  .link-btn { font: inherit; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 0; white-space: nowrap; }
  .checks { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; }
  .checks li { padding: 6px 10px; border-left: 3px solid var(--line); margin-bottom: 4px; background: var(--soft);
               border-radius: 0 6px 6px 0; overflow-wrap: anywhere; }
  .checks .ok { border-left-color: var(--ok); }
  .checks .warn { border-left-color: var(--warn); }
  .checks .err { border-left-color: var(--err); }
  .checks b { font-weight: 600; }
  .checks .msg { display: block; color: var(--muted); }
  .checks .err .msg { color: var(--err); }
  .checks .warn .msg { color: var(--warn); }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 400; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
         padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .bar-inner { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .bar .status { flex: 1 1 240px; font-size: 13px; color: var(--muted); }
  .bar .status.err { color: var(--err); }
  .primary { font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 10px; border: 0;
             background: var(--accent); color: var(--accent-fg); cursor: pointer; }
  .primary:disabled { opacity: .45; cursor: not-allowed; }
  .secondary { font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line);
               background: none; color: inherit; cursor: pointer; }
  details { margin-top: 8px; }
  .guide table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 6px; }
  .guide th, .guide td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .guide code { overflow-wrap: anywhere; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; background: var(--soft);
        padding: 10px; border-radius: 8px; max-height: 280px; overflow: auto; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1 data-t="heading"></h1></div>
    <select id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select>
  </header>
  <p class="sub" data-t-html="intro"></p>
  <p class="note" data-t-html="collabNote"></p>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-video" aria-selected="true" data-t="tabVideo"></button>
    <button role="tab" id="tab-playlist" aria-selected="false" data-t="tabPlaylist"></button>
  </div>

  <section id="pane-video">
    <fieldset>
      <legend data-t="playlist"></legend>
      <div id="pickedBox" hidden class="picked">
        <span><span id="pickedLabel"></span><span class="id" id="pickedId"></span></span>
        <button class="link-btn" id="unpick" data-t="change"></button>
      </div>
      <div id="searchBox">
        <input id="q" type="search" data-t-ph="searchPh" autocomplete="off">
        <ul class="results" id="results"></ul>
      </div>
    </fieldset>
    <fieldset>
      <label for="v-links"><span data-t="links"></span><span class="hint" data-t-html="linksHint"></span></label>
      <textarea id="v-links" data-t-ph="linksPh"></textarea>
      <ul class="checks" id="v-checks"></ul>
      <details class="guide"><summary data-t="formatTitle"></summary><div data-t-html="formatTable"></div></details>
    </fieldset>
    <div class="row">
      <fieldset id="memberBox" hidden><label for="v-member"><span data-t="member"></span><span class="hint" data-t="memberHint"></span></label>
        <select id="v-member"></select></fieldset>
      <fieldset id="eraBox" hidden><label for="v-era"><span data-t="era"></span><span class="hint" data-t="eraHint"></span></label>
        <select id="v-era"></select></fieldset>
      <fieldset><label for="v-date"><span data-t="date"></span><span class="hint" data-t="dateHint"></span></label>
        <input id="v-date" type="text" placeholder="2026-11-05"></fieldset>
    </div>
    <label class="check"><input id="v-vertical" type="checkbox"> <span data-t="vertical"></span></label>
  </section>

  <section id="pane-playlist" hidden>
    <div class="row">
      <fieldset><label for="p-kind" data-t="kind"></label><select id="p-kind"></select></fieldset>
      <fieldset><label for="p-title"><span data-t="playlistTitle"></span><span class="hint" id="p-title-hint"></span></label><input id="p-title" type="text"></fieldset>
      <fieldset id="p-memberBox" hidden><label for="p-member"><span data-t="member"></span><span class="hint" data-t="fansMemberHint"></span></label>
        <select id="p-member"></select></fieldset>
      <fieldset><label for="p-channel"><span data-t="channel"></span><span class="hint" data-t="autoHint"></span></label>
        <input id="p-channel" type="text"></fieldset>
      <fieldset><label for="p-date"><span data-t="date"></span><span class="hint" data-t="dateHint"></span></label>
        <input id="p-date" type="text" placeholder="2026-11-05"></fieldset>
    </div>
    <fieldset><label for="p-desc"><span data-t="desc"></span><span class="hint" data-t="optional"></span></label>
      <textarea id="p-desc" class="plain"></textarea></fieldset>
    <fieldset>
      <label for="p-links"><span data-t="firstLinks"></span><span class="hint" data-t-html="linksHint"></span></label>
      <textarea id="p-links" placeholder="https://youtu.be/abc123def45"></textarea>
      <ul class="checks" id="p-checks"></ul>
      <details class="guide"><summary data-t="formatTitle"></summary><div data-t-html="formatTable"></div></details>
    </fieldset>
  </section>

  <details><summary data-t="preview"></summary><pre id="preview"></pre></details>
</main>

<div class="bar"><div class="bar-inner">
  <span class="status" id="status"></span>
  <button class="secondary" id="copy" data-t="copy"></button>
  <button class="primary" id="create" disabled></button>
</div></div>

<script src="data/add-form.js"></script>

// ---------- text ----------

    ready: "준비 완료", long: "내용이 길어서 복사됩니다. 열린 이슈 본문에 붙여 넣으세요.",

    needDate: "날짜 필요 ( | 2026-11-04 )", autoDate: "날짜는 자동", ytAuto: "제목·날짜는 유튜브에서 자동",
    needThumb: "썸네일 필요 (이미지나 유튜브 링크)", tvingThumb: "썸네일은 자동으로 가져옴",
    shortTiktok: "짧은 틱톡 링크 — 봇이 확인",
    standalonePrefix: "틱톡",
  },
  en: {

    intro: "Fill in everything here; the button opens a GitHub issue that is already filled in — just press <b>Create</b>.",

    playlist: "Playlist", change: "Change", searchPh: "Search: 월간, radio star, shorts strange muse",
    links: "Links", firstLinks: "First video links",
    linksHint: "One video per line: <code>link | title | date | thumbnail</code> — only the parts each source needs (see below).",
    linksPh: "https://youtu.be/abc123def45\nhttps://www.tiktok.com/@nmixx_official/video/7704213048080207122 | 𝑵𝑬𝑶𝑵 🐶〃🐱\nhttps://www.wavve.com/player/vod?contentid=… | Ep. 988 | 2026-11-04 | https://image.wavve.com/….jpg",
    formatTitle: "How to write each source",
    formatTable: "<table><tr><th>Source</th><th>Write</th><th>Automatic</th></tr>"
      + "<tr><td>YouTube</td><td><code>link</code></td><td>title, date, channel</td></tr>"
      + "<tr><td>TikTok</td><td><code>link | title</code></td><td>date</td></tr>"
      + "<tr><td>TVING</td><td><code>link | title | date</code></td><td>thumbnail</td></tr>"

    vertical: "Vertical video (Shorts)", kind: "Kind", playlistTitle: "Playlist title", desc: "Description", optional: "Optional",

    copied: "Copied", copyFailed: "Copy failed — copy it from the preview",
    noRepo: "Unknown repository (add ?repo=owner/name)", pickPlaylist: "Pick a playlist", addLink: "Add a link",
    pickMember: "Pick a member (solo series, FANS lives)",
    badDateField: "Check the date", needPlaylistTitle: "Enter a playlist title",
    linksToFix: (n) => `${n} link(s) need fixing`, more: (n) => `+${n}`,
    unsupported: "Unsupported link", invalidDate: (d) => `Invalid date: ${d}`,
    wrongSource: (s) => `${s} videos cannot go into this playlist`, twice: "Listed twice",
    inPlaylist: "Already in this playlist", tiktokListed: "TikTok already listed",
    existing: "Existing video — its stored title and date are reused", needTitle: "Title required ( | title )",
    needDate: "Date required ( | 2026-11-04 )", autoDate: "Date automatic", ytAuto: "Title and date from YouTube",

    standalonePrefix: "TikTok",

};
const LANG_KEY = "nmixx-lang";  // shared with the main page
let lang = (() => {
  try { const s = localStorage.getItem(LANG_KEY); if (s) return s === "ko" ? "ko" : "en"; } catch {}
  return (navigator.language || "").toLowerCase().startsWith("ko") ? "ko" : "en";
})();
const t = (key, ...args) => { const v = TEXT[lang][key]; return typeof v === "function" ? v(...args) : v; };

function applyLanguage() {
  document.documentElement.lang = lang;
  $("lang").value = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-t-html]").forEach((el) => { el.innerHTML = t(el.dataset.tHtml); });
  document.querySelectorAll("[data-t-ph]").forEach((el) => { el.placeholder = t(el.dataset.tPh); });
  fill($("v-member"), F.memberChoices);
  fill($("p-member"), F.memberChoices);
  fill($("v-era"), F.eraChoices);
  fill($("p-kind"), F.kindChoices);
  if (target) pick(target);
  search();
  update();
}
$("lang").onchange = () => {
  lang = $("lang").value;
  try { localStorage.setItem(LANG_KEY, lang); } catch {}
  applyLanguage();
};
function fill(select, choices) {
  const keep = select.value;
  select.replaceChildren(...choices.map((c) => Object.assign(document.createElement("option"), { value: c.value, textContent: c[lang] })));
  if (keep) select.value = keep;
}
function targetName(tg) {
  if (tg.id === F.standalone) return `[${t("standalonePrefix")}] ${F.standaloneTitle[lang]}`;
  const era = tg.era ? " · " + (F.eraChoices.find((c) => c.value === tg.era) || { [lang]: tg.era })[lang] : "";
  return `[${(F.kindLabels[tg.kind] || { [lang]: tg.kind })[lang]}] ${tg.title}${era}`;
}

// ---------- state ----------
const repo = new URLSearchParams(location.search).get("repo")
  || (location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] + "/" + location.pathname.split("/")[1] : "");
const MAX_URL = 7000;  // GitHub rejects very long URLs; longer issues are copied and pasted instead
const norm = (s) => s.normalize("NFKC").toLowerCase().replace(/[\s\p{P}\p{S}_]+/gu, "");
const re = Object.fromEntries(Object.entries(F.patterns).map(([k, p]) => [k, new RegExp(p)]));
const dateRe = new RegExp("^(?:" + F.patterns.date + ")$");
const allIds = new Set(F.videoIds);
const noMember = F.memberChoices[0].value;
let mode = "video", target = null;

for (const [tab, name] of [["tab-video", "video"], ["tab-playlist", "playlist"]]) {
  $(tab).onclick = () => {
    mode = name;
    $("tab-video").setAttribute("aria-selected", name === "video");
    $("tab-playlist").setAttribute("aria-selected", name === "playlist");
    $("pane-video").hidden = name !== "video";
    $("pane-playlist").hidden = name !== "playlist";
    update();
  };
}

// ---------- playlist search ----------
function search() {
  const words = $("q").value.split(/\s+/).map(norm).filter(Boolean);
  const hits = words.length ? F.targets.filter((tg) => words.every((w) => norm(tg.label).includes(w))).slice(0, 50) : [];
  $("results").replaceChildren(...hits.map((tg) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = targetName(tg);
    b.append(Object.assign(document.createElement("span"), { className: "id", textContent: tg.id }));
    b.onclick = () => pick(tg);
    const li = document.createElement("li");
    li.append(b);
    return li;
  }));
}
function pick(tg) {
  target = tg;
  $("pickedLabel").textContent = targetName(tg);
  $("pickedId").textContent = tg.id;
  $("pickedBox").hidden = false;
  $("searchBox").hidden = true;
  $("eraBox").hidden = tg.id !== F.standalone;
  $("memberBox").hidden = !tg.needsMember;
  update();
}
$("q").addEventListener("input", search);
$("unpick").onclick = () => {
  target = null;
  $("pickedBox").hidden = true; $("searchBox").hidden = false; $("eraBox").hidden = true; $("memberBox").hidden = true;
  $("q").focus(); update();
};

// ---------- link checks (advisory; the bot re-checks everything) ----------
function realDate(s) {
  const m = s.trim().match(dateRe);
  if (!m) return null;
  const [y, mo, d] = [+m[1], +m[2], +m[3]], dt = new Date(Date.UTC(y, mo - 1, d));
  return dt.getUTCMonth() === mo - 1 && dt.getUTCDate() === d ? dt.toISOString().slice(0, 10) : null;
}
function identify(link) {
  let m;
  if ((m = link.match(re.youtube)) || /^[A-Za-z0-9_-]{11}$/.test(link)) return { source: "youtube", id: m ? m[1] : link };
  if (/v[mt]\.tiktok\.com/.test(link)) return { source: "tiktok", id: null };
  if ((m = link.match(re.tiktok))) return { source: "tiktok", id: m[1] };
  if ((m = link.match(re.wavve))) return { source: "wavve", id: "wv-" + m[1].replace(/\.\d+$/, "") };
  if ((m = link.match(re.tving))) return { source: "tving", id: "tv-" + m[1] };
  if ((m = link.match(re.netflix))) return { source: "netflix", id: "nf-" + m[2] };
  if ((m = link.match(re.fans))) return { source: "fans", id: m[1] };
  return null;
}
function checkLinks(text, { allowed, inTarget, standaloneTarget, formDate }) {
  const seen = new Set();
  return text.split("\n").map((l) => l.trim()).filter(Boolean).map((line) => {
    const parts = line.split("|").map((p) => p.trim());
    const head = parts[0].split(/\s+/), link = head[0];
    const extras = [head.slice(1).join(" "), ...parts.slice(1)].filter(Boolean);
    const out = { line, level: "ok", notes: [] };
    const bad = (msg) => { out.level = "err"; out.notes.push(msg); };
    const warn = (msg) => { if (out.level === "ok") out.level = "warn"; out.notes.push(msg); };
    const v = identify(link);
    if (!v) { bad(t("unsupported")); return out; }
    const name = F.sourceNames[v.source];
    let date = "", title = "", thumb = "";
    for (const x of extras) {
      if (dateRe.test(x)) { date = realDate(x); if (!date) bad(t("invalidDate", x)); }
      else if (/^https?:\/\//.test(x)) thumb = x;
      else title = x;
    }
    out.head = [name, v.id, date, title].filter(Boolean).join(" · ");
    if (!allowed.includes(v.source)) bad(t("wrongSource", name));
    if (v.id && seen.has(v.id)) bad(t("twice"));
    if (v.id) seen.add(v.id);
    if (v.id && inTarget.has(v.id)) bad(t(standaloneTarget ? "tiktokListed" : "inPlaylist"));
    if (v.id && allIds.has(v.id)) warn(t("existing"));
    else {
      if (F.needsTitle.includes(v.source) && !title) bad(t("needTitle"));
      if (!date && !formDate && !F.autoDate.includes(v.source)) bad(t("needDate"));
      if (F.needsThumb.includes(v.source) && !thumb) bad(t("needThumb"));
      if (v.source === "tving" && !thumb) warn(t("tvingThumb"));
      if (v.source === "youtube") out.notes.push(t("ytAuto"));
      else if (!date && !formDate && F.autoDate.includes(v.source)) out.notes.push(t("autoDate"));
      if (!v.id) warn(t("shortTiktok"));
    }
    return out;
  });
}
function showChecks(list, results) {
  list.replaceChildren(...results.map((r) => {
    const li = document.createElement("li");
    li.className = r.level;
    li.append(Object.assign(document.createElement("b"), { textContent: r.head || r.line }));
    for (const n of r.notes) li.append(Object.assign(document.createElement("span"), { className: "msg", textContent: n }));
    return li;
  }));
}

// ---------- issue body (bilingual labels, same layout as the GitHub issue form) ----------
const section = (label, value) => `### ${label}\n\n${(value || "").trim() || F.noResponse}\n`;
function build() {
  const problems = [];
  let title, body, results;
  if (mode === "video") {
    if (!target) problems.push(t("pickPlaylist"));
    const links = $("v-links").value, count = links.split("\n").filter((l) => l.trim()).length;
    if (!count) problems.push(t("addLink"));
    const solo = !!(target && target.needsMember);
    const member = solo ? $("v-member").value : noMember;
    if (solo && member === noMember) problems.push(t("pickMember"));
    const kind = !target ? "playlist" : target.id === F.standalone ? F.standalone
      : [F.series, F.fansKind].includes(target.kind) ? target.kind : "playlist";
    results = checkLinks(links, {
      allowed: F.allowed[kind], standaloneTarget: kind === F.standalone,
      inTarget: new Set(target ? target.v.map((i) => F.videoIds[i]) : []),
      formDate: realDate($("v-date").value),
    });
    showChecks($("v-checks"), results);
    const date = $("v-date").value.trim();
    if (date && !realDate(date)) problems.push(t("badDateField"));
    title = F.issueTitle.video + (target ? (target.title || F.standaloneTitle.ko) : "") + (count > 1 ? ` (+${count})` : "");
    body = [
      section(L.target, target && target.label), section(L.links, links), section(L.date, date),
      section(L.member, member),
      section(L.era, target && target.id === F.standalone ? $("v-era").value : ""),
      `### ${L.options}\n\n- [${$("v-vertical").checked ? "x" : " "}] ${F.vertical}\n`,
    ].join("\n");
  } else {
    const links = $("p-links").value;
    const fans = $("p-kind").value.endsWith(`(${F.fansKind})`);
    $("p-memberBox").hidden = !fans;
    $("p-title-hint").textContent = fans ? t("fansTierHint") : "";
    if (fans && $("p-member").value === noMember) problems.push(t("pickMember"));
    if (!$("p-title").value.trim()) problems.push(t("needPlaylistTitle"));
    if (!links.trim()) problems.push(t("addLink"));
    results = checkLinks(links, { allowed: fans ? F.allowed[F.fansKind] : F.allowed.playlist, standaloneTarget: false,
                                  inTarget: new Set(), formDate: realDate($("p-date").value) });
    showChecks($("p-checks"), results);
    const date = $("p-date").value.trim();
    if (date && !realDate(date)) problems.push(t("badDateField"));
    title = F.issueTitle.playlist + $("p-title").value.trim();
    body = [
      section(L.kind, $("p-kind").value), section(L.newTitle, $("p-title").value),
      section(L.channel, $("p-channel").value), section(L.desc, $("p-desc").value),
      section(L.links, links), section(L.date, date), section(L.member, fans ? $("p-member").value : noMember),
    ].join("\n");
  }
  const errors = results.filter((r) => r.level === "err").length;
  if (errors) problems.push(t("linksToFix", errors));
  return { title, body, problems };
}
const issueUrl = (params) => `https://github.com/${repo}/issues/new?` + new URLSearchParams(params);

function update() {
  const { title, body, problems } = build();
  $("preview").textContent = `# ${title}\n\n${body}`;
  const url = issueUrl({ title, body });
  const tooLong = url.length > MAX_URL;
  if (!repo) problems.unshift(t("noRepo"));
  $("create").disabled = problems.length > 0;
  $("create").textContent = t(tooLong ? "createLong" : "create");
  $("status").className = "status" + (problems.length ? " err" : "");
  $("status").textContent = problems.length ? problems.join(" · ") : t(tooLong ? "long" : "ready");
  $("create").onclick = async () => {
    if (!tooLong) return window.open(url, "_blank", "noopener");
    await copy(body);
    window.open(issueUrl({ title }), "_blank", "noopener");
  };
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); $("status").textContent = t("copied"); }
  catch { $("status").textContent = t("copyFailed"); }
}
$("copy").onclick = () => copy(build().body);
document.querySelectorAll("input, textarea, select:not(#lang)").forEach((el) => el.addEventListener("input", update));
document.querySelectorAll("select:not(#lang), input[type=checkbox]").forEach((el) => el.addEventListener("change", update));
applyLanguage();
</script>
</body>
