# Generated by scripts/add_video.py sync-form — edit the script, not this file.
name: "새 재생목록 추가 / New playlist"
description: "새 재생목록을 만들고 영상을 넣습니다 / Create a playlist with its first videos"
title: "[새 재생목록] "
body:
  - type: markdown
    attributes:
      value: "이미 있는 재생목록에 넣을 때는 '새 영상 추가'를 쓰세요. 영상이 1개 이상 있어야 사이트에 보입니다.\n\nTo add to an existing playlist use 'Add videos'. A playlist needs at least one video to show.\n\n⚠️ 저장소 주인과 협업자(Collaborator)가 만든 이슈만 봇이 처리합니다. 다른 사람의 이슈는 무시됩니다.\n\n⚠️ The bot only processes issues from the repository owner and collaborators; other issues are ignored."
  - type: dropdown
    id: kind
    attributes:
      label: "종류 / Kind"
      options:
        - "웹예능 출연 · Web show appearances (guest)"
        - "방송 · TV (tv)"
        - "NMIXX Original (original)"
        - "라이브 · Live (live)"
        - "라이브 다이어리 · Live Diary (diary)"
        - "투어·콘서트 · Tours & concerts (tour)"
        - "팬즈 라이브 · FANS lives (fans)"
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: "제목 / Title"
      description: "사이트에 보일 재생목록 이름. 팬즈 라이브는 멤버십 기수 (예: NSWER 5th), 라이브 다이어리는 연도 (예: 2027)  \nPlaylist name shown on the site. FANS lives: the membership tier (e.g. NSWER 5th); live diary: the year (e.g. 2027)"
    validations:
      required: true
  - type: input
    id: url_name
    attributes:
      label: "주소 이름 (선택) / URL name (optional)"
      description: "영문 주소 이름 (예: salon-de-doll → tv-salon-de-doll). 비우면 자동으로 만듭니다.  \nEnglish name for the link (e.g. salon-de-doll → tv-salon-de-doll). Blank = generated."
  - type: input
    id: channel
    attributes:
      label: "채널 (선택) / Channel (optional)"
      description: "방송은 방송사 필수 (예: KBS 2TV). 비우면 라이브·NMIXX Original·투어는 NMIXX, 웹예능은 첫 영상의 유튜브 채널.  \nTV: the broadcaster, required (e.g. KBS 2TV). Blank = NMIXX for live, original and tour; the first video's YouTube channel for web shows."
  - type: textarea
    id: desc
    attributes:
      label: "설명 (선택) / Description (optional)"
      description: "보통 라이브 재생목록에만 씁니다. 한국어로 쓰면 모든 언어에서 한국어로 보입니다.  \nUsually only for live playlists. It is shown as written in every language."
  - type: textarea
    id: links
    attributes:
      label: "링크 / Links"
      description: "한 줄에 영상 하나: `링크 | 제목 | 날짜 | 썸네일`. 유튜브는 `링크 | 날짜` (제목 자동, 날짜는 한국 시간 업로드 날짜). 틱톡은 `링크 | 제목` (날짜 자동). 티빙은 `링크 | 제목 | 날짜` (썸네일 자동). 웨이브·넷플릭스·팬즈는 `링크 | 제목 | 날짜 | 썸네일` (썸네일은 이미지 주소나 유튜브 링크).  \nOne video per line: `link | title | date | thumbnail`. YouTube: `link | date` (title automatic; the upload date in Korea time). TikTok: `link | title` (date automatic). TVING: `link | title | date` (thumbnail automatic). Wavve, Netflix, FANS: `link | title | date | thumbnail` (an image URL or a YouTube link)."
      placeholder: "https://youtu.be/abc123def45 | 2026-11-05\nhttps://www.wavve.com/player/vod?contentid=… | 988회 · 특집 | 2026-11-04 | https://image.wavve.com/….jpg"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: "날짜 (선택) / Date (optional)"
      description: "날짜가 없는 링크 모두에 쓰입니다 (한국 시간, 예: 2026-11-05). 비워 두면 링크마다 날짜가 필요합니다 (틱톡은 자동).  \nUsed for every link without its own date (Korea time, e.g. 2026-11-05). Blank = each line needs a date (TikTok is automatic)."
  - type: dropdown
    id: member
    attributes:
      label: "멤버 (선택) / Member (optional)"
      description: "팬즈 라이브에만 (필수).  \nOnly for FANS lives (required)."
      options:
        - "없음 / None"
        - "해원 (HAEWON)"
        - "릴리 (LILY)"
        - "설윤 (SULLYOON)"
        - "배이 (BAE)"
        - "지우 (JIWOO)"
        - "규진 (KYUJIN)"
      default: 0
