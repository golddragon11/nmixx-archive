name: "새 영상 추가 / Add videos"
description: "재생목록에 영상을 추가합니다 / Add videos to a playlist (YouTube, TikTok, Wavve, TVING, Netflix)"
title: "[새 영상] "
body:
  - type: markdown
    attributes:
      value: "재생목록을 고르고 링크를 붙여 넣은 뒤 제출하세요. 제출하면 자동으로 사이트에 반영됩니다.\n\nPick a playlist, paste the links and submit. The site updates automatically.\n\n⚠️ 저장소 주인과 협업자(Collaborator)가 만든 이슈만 봇이 처리합니다. 다른 사람의 이슈는 무시됩니다.\n\n⚠️ The bot only processes issues from the repository owner and collaborators; other issues are ignored."
  - type: textarea
    id: playlist
    attributes:
      label: "재생목록 / Playlist"
      description: "재생목록 id나 이름 일부. 여러 재생목록에 넣으려면 한 줄에 하나씩 (예: shorts strange muse / tt-unit-jiwoo-kyujin). 목록에서 찾기: https://golddragon11.github.io/nmixx-archive/add.html  \nPlaylist id or part of its name. For several playlists, one per line (e.g. shorts strange muse / tt-unit-jiwoo-kyujin). Search the list: https://golddragon11.github.io/nmixx-archive/add.html"
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: "링크 / Links"
      description: "한 줄에 영상 하나: `링크 | 제목 | 날짜 | 썸네일`. 유튜브는 링크만 (제목·날짜 자동). 틱톡은 `링크 | 제목` (날짜 자동). 티빙은 `링크 | 제목 | 날짜` (썸네일 자동). 웨이브·넷플릭스·팬즈는 `링크 | 제목 | 날짜 | 썸네일` (썸네일은 이미지 주소나 유튜브 링크).  \nOne video per line: `link | title | date | thumbnail`. YouTube: link only (title and date automatic). TikTok: `link | title` (date automatic). TVING: `link | title | date` (thumbnail automatic). Wavve, Netflix, FANS: `link | title | date | thumbnail` (an image URL or a YouTube link)."
      placeholder: "https://youtu.be/abc123def45\nhttps://www.wavve.com/player/vod?contentid=… | 988회 · 특집 | 2026-11-04 | https://image.wavve.com/….jpg"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: "날짜 (선택) / Date (optional)"
      description: "모든 링크에 같은 날짜를 쓸 때만. 비워 두면 유튜브·틱톡은 자동, 다른 출처는 링크마다 날짜가 필요합니다.  \nOnly to give every link the same date. Blank = automatic for YouTube and TikTok; other sources need a date on each line."
  - type: dropdown
    id: member
    attributes:
      label: "멤버 (선택) / Member (optional)"
      description: "멤버 솔로 시리즈(tt-solo)와 팬즈 라이브에 넣을 때만 고르세요 (필수). 여러 멤버 영상은 유닛 시리즈에 넣으세요.  \nOnly for the member-solo series (tt-solo) and FANS lives, where it is required. Videos with several members go into a unit series."
      options:
        - "없음 / None"
